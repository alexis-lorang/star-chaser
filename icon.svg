<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14206e"/>
      <stop offset=".45" stop-color="#3a2fb0"/>
      <stop offset=".78" stop-color="#7a3cc4"/>
      <stop offset="1" stop-color="#c2489e"/>
    </linearGradient>
    <radialGradient id="horizon" cx="512" cy="900" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7ab8" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#ff7ab8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff7ab8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aur" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3dffb4" stop-opacity="0"/>
      <stop offset=".18" stop-color="#3dffb4" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#36e6ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a77bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7dffcf" stop-opacity="0"/>
      <stop offset=".25" stop-color="#7dffcf" stop-opacity=".8"/>
      <stop offset="1" stop-color="#36e6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="960" y1="82" x2="598" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8fd0" stop-opacity="0"/>
      <stop offset=".55" stop-color="#ffc7a0" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fffbe8"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff6d0" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffe08a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f6e"/>
      <stop offset="1" stop-color="#1a1450"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120d3a"/>
      <stop offset="1" stop-color="#0a0828"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7dffcf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a77bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ray-blur" x="-100%" y="-10%" width="300%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#horizon)"/>

  <!-- Aurore : halo flou puis rubans nets -->
  <path d="M-40 720 C160 600 330 690 520 580 S860 470 1064 540 L1064 250 C880 230 720 360 520 330 S150 300 -40 420 Z" fill="url(#aur)" filter="url(#blur)"/>
  <path d="M-40 700 C160 590 330 670 520 565 S860 460 1064 525 L1064 300 C880 280 720 400 520 370 S150 340 -40 450 Z" fill="url(#aur)"/>
  <path d="M-40 690 C170 610 340 650 520 590 S850 520 1064 560 L1064 470 C860 430 700 520 520 520 S170 540 -40 600 Z" fill="url(#aur2)" opacity=".9"/>

  <!-- Rayons de l'aurore -->
  <g fill="url(#ray)" filter="url(#ray-blur)">
    <rect x="60" y="380" width="34" height="280"/><rect x="190" y="360" width="26" height="270"/>
    <rect x="300" y="350" width="40" height="280"/><rect x="430" y="320" width="28" height="270"/>
    <rect x="560" y="290" width="36" height="270"/><rect x="690" y="250" width="30" height="280"/>
    <rect x="800" y="230" width="38" height="270"/><rect x="930" y="240" width="28" height="270"/>
  </g>

  <!-- Étoiles -->
  <g fill="#fff">
    <circle cx="140" cy="150" r="8"/><circle cx="290" cy="90" r="5" opacity=".8"/>
    <circle cx="400" cy="210" r="5" opacity=".75"/><circle cx="190" cy="290" r="6" opacity=".85"/>
    <circle cx="120" cy="470" r="4" opacity=".6"/><circle cx="470" cy="90" r="4" opacity=".7"/>
    <circle cx="880" cy="430" r="5" opacity=".75"/><circle cx="960" cy="300" r="4" opacity=".6"/>
    <circle cx="740" cy="200" r="4" opacity=".65"/><circle cx="330" cy="420" r="4" opacity=".55"/>
  </g>
  <!-- Petites étoiles à quatre branches -->
  <g fill="#fff">
    <path d="M300 300 q4 26 30 30 q-26 4 -30 30 q-4 -26 -30 -30 q26 -4 30 -30 z" opacity=".9"/>
    <path d="M860 140 q3 19 22 22 q-19 3 -22 22 q-3 -19 -22 -22 q19 -3 22 -22 z" opacity=".8"/>
  </g>

  <!-- Étoile filante -->
  <path d="M960 82 L621 433 L575 383 Z" fill="url(#trail)" filter="url(#soft)" opacity=".85"/>
  <path d="M960 82 L610 421 L586 395 Z" fill="url(#trail)"/>
  <circle cx="598" cy="408" r="150" fill="url(#halo)"/>
  <path d="M598 300 q12 96 108 108 q-96 12 -108 108 q-12 -96 -108 -108 q96 -12 108 -108 z" fill="#fffaf0"/>
  <circle cx="598" cy="408" r="22" fill="#fff"/>

  <!-- Relief -->
  <path d="M0 1024 L0 800 C140 745 260 775 380 730 S640 760 760 710 S940 730 1024 760 L1024 1024 Z" fill="url(#hill1)"/>
  <path d="M0 800 C140 745 260 775 380 730 S640 760 760 710 S940 730 1024 760" fill="none" stroke="#ff9ad0" stroke-opacity=".35" stroke-width="5"/>
  <path d="M0 1024 L0 900 C200 868 420 908 600 858 S880 820 1024 840 L1024 1024 Z" fill="url(#hill2)"/>
</svg>
