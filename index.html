<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Star Chaser</title>
  <meta name="description" content="Seeing, aurores, étoiles filantes et événements astronomiques">
  <meta name="theme-color" content="#0b0f24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Star Chaser">
  <link rel="apple-touch-icon" sizes="180x180" href="https://alexis-lorang.github.io/star-chaser/apple-touch-icon-180x180.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://alexis-lorang.github.io/star-chaser/apple-touch-icon-precomposed.png">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <script>
    // Thème choisi (ou celui de l'iPhone) appliqué avant l'affichage de la page.
    (function () {
      var p = 'auto';
      try { p = localStorage.getItem('sc-theme') || 'auto'; } catch (e) { /* stockage indisponible */ }
      var light = p === 'light' || (p === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      var root = document.documentElement;
      root.dataset.theme = light ? 'light' : 'dark';
      if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) root.classList.add('standalone');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#eef2ff' : '#0b0f24');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <script>
    // Ouvert en double-cliquant sur index.html : les modules JS sont bloqués en file://.
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.insertAdjacentHTML('afterbegin',
          '<div class="file-warning">Ouvre l’application via le serveur local : double-clique sur <b>« Lancer le dashboard.command »</b>.</div>');
      });
    }
  </script>

  <!-- Ciel étoilé derrière les pages (thème sombre) -->
  <div class="starfield" aria-hidden="true"></div>

  <!-- Un onglet = une page -->
  <section class="page on" id="seeing" data-tab="seeing" aria-label="Seeing">
    <div class="ptr" aria-hidden="true"></div>
    <div class="scroller">
      <div class="large-title with-action">
        <div>
          <h1 tabindex="-1">Seeing</h1>
          <p class="subtitle status"></p>
        </div>
        <div class="title-actions">
          <button class="icon-btn" data-action="place" aria-label="Lieu d’observation" data-ic="pin"></button>
          <button class="icon-btn" data-action="settings" aria-label="Réglages" data-ic="settings"></button>
        </div>
      </div>
      <main id="seeing-body" class="content"></main>
    </div>
  </section>

  <section class="page" id="aurora" data-tab="aurora" aria-label="Aurora" inert>
    <div class="ptr" aria-hidden="true"></div>
    <div class="scroller">
      <div class="large-title with-action">
        <div>
          <h1 tabindex="-1">Aurora</h1>
          <p class="subtitle status"></p>
        </div>
        <div class="title-actions">
          <button class="icon-btn" data-action="place" aria-label="Lieu d’observation" data-ic="pin"></button>
          <button class="icon-btn" data-action="settings" aria-label="Réglages" data-ic="settings"></button>
        </div>
      </div>
      <main id="aurora-body" class="content"></main>
    </div>
  </section>

  <section class="page" id="meteors" data-tab="meteors" aria-label="Meteors" inert>
    <div class="ptr" aria-hidden="true"></div>
    <div class="scroller">
      <div class="large-title with-action">
        <div>
          <h1 tabindex="-1">Meteors</h1>
          <p class="subtitle status"></p>
        </div>
        <div class="title-actions">
          <button class="icon-btn" data-action="place" aria-label="Lieu d’observation" data-ic="pin"></button>
          <button class="icon-btn" data-action="settings" aria-label="Réglages" data-ic="settings"></button>
        </div>
      </div>
      <main id="meteors-body" class="content"></main>
    </div>
  </section>

  <section class="page" id="events" data-tab="events" aria-label="Autres" inert>
    <div class="ptr" aria-hidden="true"></div>
    <div class="scroller">
      <div class="large-title with-action">
        <div>
          <h1 tabindex="-1">Autres</h1>
          <p class="subtitle status"></p>
        </div>
        <div class="title-actions">
          <button class="icon-btn" data-action="place" aria-label="Lieu d’observation" data-ic="pin"></button>
          <button class="icon-btn" data-action="settings" aria-label="Réglages" data-ic="settings"></button>
        </div>
      </div>
      <main id="events-body" class="content"></main>
    </div>
  </section>

  <!-- Barre d'onglets flottante, en bas : rien d'interactif sous la barre d'état d'iOS -->
  <nav class="tabbar" role="tablist" aria-label="Onglets">
    <span class="tab-thumb" aria-hidden="true"></span>
    <button class="tab" role="tab" data-tab="seeing" aria-selected="true" data-ic="telescope"><span>Seeing</span></button>
    <button class="tab" role="tab" data-tab="aurora" aria-selected="false" data-ic="aurora"><span>Aurora</span></button>
    <button class="tab" role="tab" data-tab="meteors" aria-selected="false" data-ic="meteor"><span>Meteors</span></button>
    <button class="tab" role="tab" data-tab="events" aria-selected="false" data-ic="sparkles"><span>Autres</span></button>
  </nav>

  <!-- Feuille modale (réglages, lieu, détails) -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-grab" aria-hidden="true"><i></i></div>
      <div class="sheet-head">
        <span></span>
        <h2 id="sheet-title" tabindex="-1" autofocus></h2>
        <button class="sheet-close" data-action="close-sheet" aria-label="Fermer"></button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </dialog>

  <script type="module" src="js/app.js?v=16"></script>
</body>
</html>
